[project]
name = "tmovers"
version = "0.1.0"
description = "GPU-parallel MJX simulator of the ant T-load puzzle (Dreyer et al., PNAS 2024)"
authors = [
    { name = "mengfn", email = "moefang@icloud.com" }
]
requires-python = ">=3.12"
dependencies = [
    "flax>=0.12.10",
    "jax>=0.12.0.1",
    "mujoco>=3.17.0",
    "mujoco-mjx>=3.17.0",
    "optax>=0.2.8",
    "scipy>=1.18.1",
]

[project.optional-dependencies]
cuda12 = ["jax[cuda12]>=0.12.0.1"]
cuda13 = ["jax[cuda13]>=0.12.0.1"]

[build-system]
requires = ["uv_build>=0.12.4,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "matplotlib>=3.11.2",
    "pytest>=9.1.1",
]
